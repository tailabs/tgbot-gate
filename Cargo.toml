[package]
name = "tgbot-gate"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.9"
bytes = "=1.11.1"
http = "=1.4.0"
rand = "=0.10.1"
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.10", features = ["fs"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.27.0"
